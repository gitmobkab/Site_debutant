                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <style>
                    body {
                        display: flex;
                        flex-direction: column;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        margin: 0;
                    }
                    #password {
                        width: 400px;
                        height: 40px;
                    }
                    #buttons {
                        display: flex;
                        gap: 10px;
                    }
                   #generer {
                        background-color: #a8c4e0;
                        border: 1px solid black;
                        padding: 10px 20px;
                        cursor: pointer;
                    }
                     #option {
    background-color: white;
    border: 1px solid black;
    padding: 10px;
    cursor: pointer;
}
#password {
    margin-bottom: 10px;
}

#nombre {
    margin-bottom: 10px;
}

#boutons {
    gap: 20px;
}
footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background-color: #2d2d2d;
    color: white;
    text-align: center;
    padding: 15px 0;
}
#display {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: #1a1a1a;
    color: white;
    padding: 30px;
    width: 400px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}
                    </style>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Document</title>
                </head>
                <body>
                    <input type="text" id="password" readonly>
                    <input type="number" id="nombre">
                <div id="buttons">
                    <button id="generer" onclick="make_password()">generer</button>
                    <button id="option" onclick="display_option()">⚙️</button>
                </div>
                    
                    <div id="display" style="display: none;">
                        <input type="checkbox" id="majuscules"> Majuscules       
                        <input type="checkbox" id="minuscules"> Minuscules       
                        <input type="checkbox" id="chiffres"> Chiffres   
                        <input type="checkbox" id="symboles"> Symboles   
                        <input type="checkbox" id="emojis"> Emojis
                    </div>
                    <script>
                    
                    const minuscules = "abcdefghijklmnopqrstuvwxyz"
                    const majuscules = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
                    const chiffres = "0123456789"
                    const symboles = "!@#$%^&*()_+-=[]{}"
                    const emojis = "\uD83D\uDE00\uD83D\uDE02\uD83D\uDD25\uD83D\uDC80\uD83C\uDF89"  
                

                function make_password() { 
                            let pool =""
                          
                        if (document.getElementById("minuscules").checked) {
                            pool+=minuscules
                        }
                            if (document.getElementById("majuscules").checked) {
                                pool+=majuscules
                            }    

                            if (document.getElementById("chiffres").checked) {
                                pool+=chiffres
                            }
                        if (document.getElementById("symboles").checked) {
                            pool+=symboles
                        } 
                        if (document.getElementById("emojis").checked) {
                    pool+=emojis
                }
                      if (pool === "") {
        alert("veuillez sélectionner au moins un type de caractère")
        return
    }
                    let result = ""  
                        let nombre = parseInt(document.getElementById("nombre").value)
                        if (isNaN(nombre)) {
                            alert("veuillez ecrire le nombre de caractère")
                        } 
                        else{
                            for (let i = 0; i < nombre; i++) {
                                result+= pool[Math.floor(Math.random()*pool.length)]
                                
                            }
                            document.getElementById("password").value = result
                                }
                }
                        function display_option() {
                            let div = document.getElementById("display")
                            if (div.style.display === "none") {
                                div.style.display = "block"
                            }
                            else{
                                div.style.display = "none"
                            }
                        }
                
                    </script>
                    <footer>FOOTER and whatever</footer>
                </body>
                </html>
