<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generateur de mot de passe</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <main>
        <div id="container">
            <input type="text" id="passwd" readonly>
            <div id="btn_rows">
                <button id="passwd_btn">Generer un mot de passe</button>
                <button id="settings_btn">
                    <img src="assets/settings.svg" alt="settings button" id="setting_btn_icon">
                </button>
            </div>
        </div>
    </main>

    <div id="menu_overlay">
        <div id="settings_menu">
        <h2>Parametres</h2>
        <div class="setting_row ">
            <label for="pass_length">Longueur du mot de passe:</label>
            <input type="number" id="pass_length" value="12">
        </div>
        
        <button id="close_btn">
            <img src="assets/close.svg" alt="close button">
        </button>
    </div>

    </div>

    <footer>
        <p>Copyright Mobsy & Xmanips - Tous droits réservés</p>
    </footer>
    <script src="scripts/ui.js"></script>
</body>

</html>
