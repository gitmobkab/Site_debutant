<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generateur de mot de passe</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <main>
        <div id="container">
            <input type="text" id="passwd" readonly>
            <div id="btn_rows">
                <button id="passwd_btn" onclick="make_password()">Generer un mot de passe</button>
                <button id="settings_btn" onclick="display_option()">
                    <img src="assets/settings.svg" alt="settings button">
                </button>
            </div>
        </div>
    </main>

    <div id="menu_overlay" style="display:none;">
        <div id="settings_menu">
            <h2>Parametres</h2>
            <div class="setting_row">
                <label for="pass_length">Longueur du mot de passe:</label>
                <input type="number" id="pass_length" value="12">
            </div>
            <div class="setting_row">
                <label>Types de caractères:</label>
                <label><input type="checkbox" id="minuscules"> Minuscules</label>
                <label><input type="checkbox" id="majuscules"> Majuscules</label>
                <label><input type="checkbox" id="chiffres"> Chiffres</label>
                <label><input type="checkbox" id="symboles"> Symboles</label>
                <label><input type="checkbox" id="emojis"> Emojis</label>
            </div>
            <button id="close_btn" onclick="display_option()">✕</button>
        </div>
    </div>

    <footer>
        <p>Copyright Mobsy & Xmanips - Tous droits réservés</p>
    </footer>
    <script src="scripts/ui.js"></script>
</body>
</html>
